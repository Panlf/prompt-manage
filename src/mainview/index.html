<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>提示词管理</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app">
      <header id="title-bar">
        <div class="title-bar-drag">
          <div class="title-bar-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <defs>
                <linearGradient id="titleBarLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0071e3"/>
                  <stop offset="100%" stop-color="#64d2ff"/>
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="14" height="14" rx="3" fill="url(#titleBarLogoGrad)"/>
              <text x="8" y="12" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#ffffff" font-weight="600">P</text>
            </svg>
          </div>
          <div class="title-bar-title">提示词管理</div>
        </div>
        <div class="title-bar-controls">
          <div class="theme-picker" id="theme-picker">
            <button class="window-btn btn-theme" id="btn-theme" title="页面配色">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <path d="M8 14.5A6.5 6.5 0 118 1.5c2.4 0 4.4 1.6 4.4 3.6 0 1.5-1.2 2.6-2.7 2.6h-1a1.3 1.3 0 00-1 2.2c.3.4.3 1-.1 1.4-.4.4-1 .2-1.6.2z"/>
                <circle cx="5.2" cy="6.4" r="0.9" fill="currentColor" stroke="none"/>
                <circle cx="9" cy="4.6" r="0.9" fill="currentColor" stroke="none"/>
                <circle cx="11.4" cy="7.6" r="0.9" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <div class="theme-menu" id="theme-menu" hidden>
              <div class="theme-menu-title">页面配色</div>
              <button class="theme-option" data-theme-value="">
                <span class="theme-swatch" style="background:linear-gradient(135deg,#f8fafc,#dde5ee)"></span>默认
              </button>
              <button class="theme-option" data-theme-value="sky">
                <span class="theme-swatch" style="background:#b7d7f0"></span>天蓝
              </button>
              <button class="theme-option" data-theme-value="green">
                <span class="theme-swatch" style="background:#bcdcc2"></span>淡绿
              </button>
              <button class="theme-option" data-theme-value="orange">
                <span class="theme-swatch" style="background:#f0d3a8"></span>淡橘
              </button>
              <button class="theme-option" data-theme-value="purple">
                <span class="theme-swatch" style="background:#241f2e"></span>紫黑
              </button>
            </div>
          </div>
          <button class="window-btn btn-minimize" id="btn-minimize" title="最小化">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1" fill="currentColor"/></svg>
          </button>
          <button class="window-btn btn-maximize" id="btn-maximize" title="最大化">
            <svg class="icon-maximize" width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="0.5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
            <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10" style="display:none"><rect x="2.5" y="0.5" width="6" height="6" rx="0.5" stroke="currentColor" stroke-width="1" fill="none"/><rect x="0.5" y="2.5" width="6" height="6" rx="0.5" stroke="currentColor" stroke-width="1" fill="var(--paper)"/></svg>
          </button>
          <button class="window-btn btn-close" id="btn-close" title="关闭">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div class="app-body">
        <aside id="sidebar"></aside>
        <main id="main-content"></main>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
